<!doctype html>
<html lang="ja" data-piyoron-style="glass">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piyoron カタログ(Web)</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../piyoron.css">
<link rel="stylesheet" href="./demo.css">
</head>
<body>
<main>
  <h1>Piyoron カタログ(Web)</h1>

  <section>
    <h2>色</h2>
    <div class="stack">
      <div class="piyo-chip-group" id="palettes"></div>
      <label class="caption" for="hue">カスタム(色相)</label>
      <input id="hue" type="range" min="0" max="359" value="200">
    </div>
  </section>

  <section>
    <h2>ボタン</h2>
    <div class="stack">
      <div class="row">
        <button class="piyo-btn piyo-icon-btn" aria-label="追加"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="piyo-btn piyo-icon-btn piyo-primary" aria-label="決定"><svg class="icon" viewBox="0 0 24 24"><path d="M5 12.5l5 5L19 7"/></svg></button>
        <button class="piyo-btn piyo-icon-btn piyo-danger" aria-label="削除"><svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 12.5h9l1-12.5"/></svg></button>
      </div>
      <div class="row">
        <button class="piyo-btn">保存</button>
        <button class="piyo-btn"><svg class="icon" viewBox="0 0 24 24"><path d="M12 4l2.4 5.2 5.6.6-4.2 3.8 1.2 5.6-5-2.8-5 2.8 1.2-5.6L4 9.8l5.6-.6z"/></svg>お気に入り</button>
        <button class="piyo-btn piyo-primary">確定</button>
        <button class="piyo-btn piyo-danger"><svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 12.5h9l1-12.5"/></svg>削除</button>
        <button class="piyo-btn" disabled>無効</button>
        <button class="piyo-btn piyo-primary" disabled>無効</button>
      </div>
    </div>
  </section>

  <section>
    <h2>選ぶボタン</h2>
    <div class="stack">
      <p class="caption">並び順</p>
      <div class="piyo-chip-group" role="radiogroup">
        <button class="piyo-chip" role="radio" aria-checked="true">新しい順</button>
        <button class="piyo-chip" role="radio" aria-checked="false">古い順</button>
      </div>
      <p class="caption">複数選択</p>
      <div class="piyo-chip-group">
        <button class="piyo-chip" aria-pressed="false">文書</button>
        <button class="piyo-chip" aria-pressed="true">画像</button>
        <button class="piyo-chip" aria-pressed="false">動画</button>
      </div>
    </div>
  </section>

  <section>
    <h2>タブ</h2>
    <div class="stack">
      <div class="piyo-tabs" role="tablist" style="--piyo-tabs-n: 4; --piyo-tabs-i: 0">
        <span class="piyo-tabs-thumb"></span>
        <button class="piyo-tab" role="tab" aria-selected="true">すべて</button>
        <button class="piyo-tab" role="tab" aria-selected="false">未読</button>
        <button class="piyo-tab" role="tab" aria-selected="false">既読</button>
        <button class="piyo-tab" role="tab" aria-selected="false">保存</button>
      </div>
      <div class="piyo-tabs" role="tablist" style="--piyo-tabs-n: 2; --piyo-tabs-i: 1">
        <span class="piyo-tabs-thumb"></span>
        <button class="piyo-tab" role="tab" aria-selected="false">カード</button>
        <button class="piyo-tab" role="tab" aria-selected="true">一覧</button>
      </div>
    </div>
  </section>

  <section>
    <h2>カード</h2>
    <div class="stack">
      <div class="piyo-card">
        <strong>お知らせ</strong>
        <span class="caption">中身を縦に並べる面。斜めのグラデーション、薄い枠、線状の影</span>
      </div>
      <button class="piyo-card piyo-pressable">
        <strong>押せるカード</strong>
        <span class="caption">押すと縮む</span>
      </button>
    </div>
  </section>
  <section>
    <h2>ひょうたん</h2>
    <div class="row" style="align-items:flex-start; gap:24px">
      <div class="piyo-gourd" id="gourd-v"><button class="piyo-gourd-button" aria-label="ホーム"><svg class="icon" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg></button><button class="piyo-gourd-button" aria-label="検索"><svg class="icon" viewBox="0 0 24 24"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"/></svg></button><button class="piyo-gourd-button" aria-label="自分"><svg class="icon" viewBox="0 0 24 24"><path d="M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM4 20c1-4 4-6 8-6s7 2 8 6"/></svg></button></div>
      <div class="piyo-gourd" id="gourd-h" data-orientation="horizontal"><button class="piyo-gourd-button" aria-label="ホーム"><svg class="icon" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg></button><button class="piyo-gourd-button" aria-label="検索"><svg class="icon" viewBox="0 0 24 24"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"/></svg></button><button class="piyo-gourd-button" aria-label="自分"><svg class="icon" viewBox="0 0 24 24"><path d="M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM4 20c1-4 4-6 8-6s7 2 8 6"/></svg></button></div>
    </div>
  </section>

  <section>
    <h2>ひょうたんとパネル</h2>
    <div class="piyo-gourd-panel" id="gourd-panel" style="height:240px">
      <div class="piyo-gourd"><button class="piyo-gourd-button" aria-label="ホーム"><svg class="icon" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg></button><button class="piyo-gourd-button" aria-label="検索"><svg class="icon" viewBox="0 0 24 24"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"/></svg></button><button class="piyo-gourd-button" aria-label="自分"><svg class="icon" viewBox="0 0 24 24"><path d="M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM4 20c1-4 4-6 8-6s7 2 8 6"/></svg></button></div>
      <div class="piyo-gourd-panel-content" style="padding:16px"><strong id="panel-title">ホーム</strong><p class="caption">表示中のタブをもう一度押すと閉じる</p></div>
    </div>
  </section>
  <section>
    <h2>メニュー</h2>
    <div class="stack">
      <p class="caption">開閉の動き</p>
      <div class="piyo-chip-group" id="menu-transition" role="radiogroup">
        <button class="piyo-chip" role="radio" aria-checked="true" data-value="fade">Fade</button>
        <button class="piyo-chip" role="radio" aria-checked="false" data-value="scale">Scale</button>
        <button class="piyo-chip" role="radio" aria-checked="false" data-value="genie">Genie</button>
        <button class="piyo-chip" role="radio" aria-checked="false" data-value="none">None</button>
      </div>
      <p class="caption">ボタンに対する位置(<span id="align-value">1.00</span>)</p>
      <input id="menu-align" type="range" min="-1" max="1" step="0.01" value="1">
      <div class="row" style="justify-content: space-between">
        <button class="piyo-btn" id="menu-a">ファイル</button>
        <button class="piyo-btn" id="menu-b">表示</button>
        <button class="piyo-btn piyo-icon-btn" id="menu-c" aria-label="その他"><svg class="icon" viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg></button>
      </div>
      <div class="stack" style="align-items: flex-start">
        <button class="piyo-btn piyo-icon-btn" id="menu-v1" aria-label="並べ替え"><svg class="icon" viewBox="0 0 24 24"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg></button>
        <button class="piyo-btn piyo-icon-btn" id="menu-v2" aria-label="共有"><svg class="icon" viewBox="0 0 24 24"><path d="M12 4v11M8 8l4-4 4 4M5 13v6h14v-6"/></svg></button>
      </div>
    </div>
  </section>

  <div class="piyo-menu" id="menu-a-panel">
    <button class="piyo-menu-item">新規作成<span class="piyo-menu-detail">Ctrl+N</span></button>
    <button class="piyo-menu-item">開く<span class="piyo-menu-detail">Ctrl+O</span></button>
    <button class="piyo-menu-item" data-piyo-keep-open id="menu-more">最近のファイルを表示</button>
    <div id="menu-recent" hidden>
      <button class="piyo-menu-item">報告書.txt</button>
      <button class="piyo-menu-item">見積もり.csv</button>
    </div>
    <hr class="piyo-menu-divider">
    <button class="piyo-menu-item piyo-danger">削除</button>
  </div>
  <div class="piyo-menu" id="menu-b-panel">
    <button class="piyo-menu-item">拡大</button>
    <button class="piyo-menu-item">縮小</button>
    <button class="piyo-menu-item" disabled>全画面</button>
  </div>
  <div class="piyo-menu" id="menu-c-panel">
    <div style="padding: 8px 12px; max-width: 220px">
      <strong>自由な中身</strong>
      <p class="caption">項目でなくても置ける。閉じるのは close() を呼ぶ</p>
      <button class="piyo-btn piyo-primary" id="menu-c-close">閉じる</button>
    </div>
  </div>
  <div class="piyo-menu" id="menu-v1-panel">
    <button class="piyo-menu-item">名前順</button>
    <button class="piyo-menu-item">日付順</button>
  </div>
  <div class="piyo-menu" id="menu-v2-panel">
    <button class="piyo-menu-item">リンクをコピー</button>
    <button class="piyo-menu-item">メールで送る</button>
  </div>
</main>
<script>
  // 確認用: 起きたエラーを body に残す
  window.addEventListener('error', (e) => { document.body.dataset.error = e.message; });
</script>
<script type="module">
  import { PiyoMenu, PiyoMenuGroup } from '../src/menu.js';
  import { GourdTabRail, GourdRailPanel } from '../src/gourd.js';
  import { piyoPresets, setPiyoPreset, setPiyoSeed, seedFromHue } from '../src/theme.js';

  // 色のプリセットを切り替える選ぶボタン
  const box = document.getElementById('palettes');
  // 選んだ色の選ぶボタンだけを選んだ状態にする
  const mark = (chip) => box.querySelectorAll('.piyo-chip').forEach((c) => c.setAttribute('aria-pressed', String(c === chip)));
  for (const name of piyoPresets) {
    const chip = document.createElement('button');
    chip.className = 'piyo-chip';
    chip.textContent = name[0].toUpperCase() + name.slice(1);
    chip.setAttribute('aria-pressed', String(name === 'ocean'));
    chip.addEventListener('click', () => {
      setPiyoPreset(name);
      mark(chip);
    });
    box.append(chip);
  }
  // URL で色を指定する(確認用。?preset=gold、?hue=280)
  const query = new URLSearchParams(location.search);
  if (query.get('preset')) {
    setPiyoPreset(query.get('preset'));
    mark([...box.children].find((c) => c.textContent.toLowerCase() === query.get('preset')));
  }
  if (query.get('hue')) {
    setPiyoSeed(seedFromHue(Number(query.get('hue'))));
    mark(null);
  }

  // 色相の帯で、シード色から色を作る
  document.getElementById('hue').addEventListener('input', (e) => {
    setPiyoSeed(seedFromHue(Number(e.target.value)));
    mark(null);
  });
  // タブを押したら、つまみを滑らせる
  document.querySelectorAll('.piyo-tabs').forEach((tabs) => {
    const items = [...tabs.querySelectorAll('.piyo-tab')];
    items.forEach((tab, i) => tab.addEventListener('click', () => {
      tabs.style.setProperty('--piyo-tabs-i', i);
      items.forEach((t) => t.setAttribute('aria-selected', String(t === tab)));
    }));
  });
  // 選ぶボタンを押したら選ぶ(1つだけ / いくつでも)
  document.querySelectorAll('.piyo-chip-group:not(#palettes)').forEach((group) => {
    const single = group.getAttribute('role') === 'radiogroup';
    group.querySelectorAll('.piyo-chip').forEach((chip) => chip.addEventListener('click', () => {
      if (single) group.querySelectorAll('.piyo-chip').forEach((c) => c.setAttribute('aria-checked', String(c === chip)));
      else chip.setAttribute('aria-pressed', String(chip.getAttribute('aria-pressed') !== 'true'));
    }));
  });

  // ひょうたん
  new GourdTabRail(document.getElementById('gourd-v'), { selected: Number(query.get('sel') ?? 0) });
  new GourdTabRail(document.getElementById('gourd-h'), { selected: 1, bouncy: true });
  // ひょうたんとパネル
  const titles = ['ホーム', '検索', '自分'];
  const panel = new GourdRailPanel(document.getElementById('gourd-panel'), {
    open: query.get('open') !== '0',
    onSelect: (i) => {
      panel.select(i);
      document.getElementById('panel-title').textContent = titles[i];
    },
  });
  // メニュー(横並びの3つで1組、縦並びの2つで1組)
  const row = new PiyoMenuGroup();
  const column = new PiyoMenuGroup({ side: 'right', align: 'start-corner' });
  // ボタンとメニューをつなぐ
  const menuOf = (id, group) => new PiyoMenu(document.getElementById(id), document.getElementById(`${id}-panel`), { group });
  const menus = { a: menuOf('menu-a', row), b: menuOf('menu-b', row), c: menuOf('menu-c', row) };
  menuOf('menu-v1', column);
  menuOf('menu-v2', column);
  document.getElementById('menu-c-close').addEventListener('click', () => menus.c.close());
  document.getElementById('menu-more').addEventListener('click', (e) => {
    const recent = document.getElementById('menu-recent');
    recent.hidden = !recent.hidden;
    e.currentTarget.textContent = recent.hidden ? '最近のファイルを表示' : '最近のファイルを隠す';
  });
  document.querySelectorAll('#menu-transition .piyo-chip').forEach((chip) => chip.addEventListener('click', () => {
    row.transition = chip.dataset.value;
    column.transition = chip.dataset.value;
  }));
  document.getElementById('menu-align').addEventListener('input', (e) => {
    const v = Number(e.target.value);
    row.align = v;
    document.getElementById('align-value').textContent = v.toFixed(2);
    Object.values(menus).forEach((m) => m.isOpen && m.render());
  });
  window.piyoDemo = { panel };
  // 動きの途中で止めて見る(確認用。?genie=0.5、?move=0.4、?menu=a&tr=genie&mt=0.3)
  if (query.get('genie')) {
    panel.closing = true;
    panel.time = Number(query.get('genie'));
    panel.layout();
  }
  if (query.get('menu')) {
    const m = { a: menus.a, b: menus.b, c: menus.c }[query.get('menu')];
    row.transition = query.get('tr') ?? 'fade';
    if (query.get('align')) row.align = Number(query.get('align'));
    m.open();
    Object.values(m.stops).forEach((stop) => stop());
    m.closing = Boolean(query.get('mt'));
    m.time = Number(query.get('mt') ?? 1);
    m.render();
  }
  if (query.get('move')) {
    const ind = panel.indicator;
    Object.assign(ind.motion, { from: 0, to: 2, t: Number(query.get('move')), moving: true });
    ind.render();
  }
  document.body.dataset.ready = 'true';
</script>
</body>
</html>
